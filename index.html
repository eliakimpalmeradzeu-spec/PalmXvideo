<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalmxVideo</title>
  <style>
    /* RESET & STYLES DE BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      width: 100%;
      min-height: 100%;
      background-color: #0b0b0e;
    }

    body {
      background-color: #0b0b0e;
      color: #ffffff;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Empêche les éléments flex de dépasser de la hauteur disponible */
    #main-app {
      min-height: 0;
      height: 100dvh;
    }

    /* Zone sûre pour les téléphones avec barre de navigation système */
    button, input, textarea, select {
      touch-action: manipulation;
    }

    /* ÉCRAN D'ACCUEIL (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      background: radial-gradient(circle, #1a0507 0%, #050507 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .logo-text {
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .bankai-x {
      width: 55px;
      height: 55px;
      margin: 0 4px;
      filter: drop-shadow(0 0 12px #ff0033);
      animation: pulse-glow 2s infinite alternate;
    }

    @keyframes pulse-glow {
      0% { filter: drop-shadow(0 0 8px #ff0033); transform: scale(1); }
      100% { filter: drop-shadow(0 0 20px #ff0033); transform: scale(1.05); }
    }

    .enter-btn {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #cc002b, #80001a);
      border: 1px solid #ff3355;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(204, 0, 43, 0.4);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 25px rgba(255, 0, 51, 0.8);
      background: linear-gradient(135deg, #ff0033, #a00020);
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* INTERFACE PRINCIPALE */
    #main-app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      min-height: 0;
      opacity: 0;
      transition: opacity 1s ease 0.3s;
    }

    #main-app.visible {
      opacity: 1;
    }

    .header-search {
      padding: 12px 15px;
      background-color: #121218;
      border-bottom: 1px solid #22222e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 18px;
      padding-right: 40px;
      background-color: #1a1a24;
      border: 1px solid #333344;
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-input:focus {
      border-color: #ff0033;
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.3);
    }

    .search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 1rem;
    }

    .lang-container {
      position: relative;
    }

    .lang-btn {
      background-color: #1a1a24;
      border: 1px solid #333344;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background-color: #181822;
      border: 1px solid #333344;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      width: 150px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
    }

    .lang-dropdown.show { display: block; }

    .lang-option {
      padding: 10px 15px;
      color: #ddd;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .lang-option:hover {
      background-color: #ff0033;
      color: #fff;
    }

    /* FLUX DE CONTENU */
    .content-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .media-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .media-card {
      background-color: #161620;
      border: 1px solid #282836;
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .media-card:hover {
      transform: translateY(-5px);
      border-color: #ff0033;
    }

    .media-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      z-index: 2;
    }

    .badge-series { background-color: #ff0033; color: #fff; }
    .badge-film { background-color: #0088ff; color: #fff; }

    .media-cover {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: #121218;
    }

    .media-info {
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .media-title {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .media-sub {
      font-size: 0.8rem;
      color: #888;
    }

    .no-videos {
      color: #888899;
      font-size: 1.1rem;
      text-align: center;
      margin-top: 50px;
    }

    /* BARRE DE NAVIGATION INFÉRIEURE */
    .bottom-nav {
      flex: 0 0 auto;
      min-height: 65px;
      height: auto;
      padding: 7px 0 max(7px, env(safe-area-inset-bottom));
      background-color: #121218;
      border-top: 1px solid #22222e;
      display: flex;
      justify-content: space-around;
      align-items: center;
      position: relative;
      z-index: 50;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #888899;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      flex: 1;
      width: 100%;
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .nav-btn:hover, .nav-btn.active {
      color: #ff0033;
    }

    .account-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .account-dropdown {
      display: none;
      position: absolute;
      bottom: 70px;
      right: 15px;
      background-color: #181822;
      border: 1px solid #333344;
      border-radius: 12px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.6);
      width: 220px;
      overflow: hidden;
      z-index: 100;
    }

    .account-dropdown.show { display: block; }

    .account-option {
      padding: 12px 16px;
      color: #ddd;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .account-option:hover {
      background-color: #ff0033;
      color: #fff;
    }

    .account-option.premium-opt {
      border-bottom: 1px solid #22222e;
      color: #ffcc00;
      font-weight: 600;
    }

    .account-option.creator-opt {
      border-bottom: 1px solid #22222e;
      color: #00ff88;
      font-weight: 600;
    }

    .account-info-header {
      padding: 10px 16px;
      font-size: 0.8rem;
      color: #888;
      border-bottom: 1px solid #22222e;
      word-break: break-all;
    }

    /* MODALES & TABLES DE CHOIX */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top))
               12px
               max(12px, env(safe-area-inset-bottom));
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background-color: #121218;
      border: 1px solid #2a2a38;
      border-radius: 20px;
      padding: 25px;
      width: min(90%, 550px);
      max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
      box-shadow: 0 10px 30px rgba(255, 0, 51, 0.15);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 18px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-close:hover { color: #ff0033; }

    /* TABLEAU DE SÉLECTION D'OPTION DE PUBLICATION */
    .publish-type-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 12px;
      margin-top: 15px;
    }

    .type-box {
      background: #181824;
      border: 2px solid #333344;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .type-box:hover {
      border-color: #ff0033;
      transform: translateY(-3px);
      background: #201520;
    }

    .type-box-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .type-box-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    /* FORMULAIRES */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: #aaa;
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 14px;
      background-color: #1a1a24;
      border: 1px solid #333344;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .form-textarea {
      resize: vertical;
      min-height: 60px;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: #ff0033;
    }

    .auth-submit-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #cc002b, #80001a);
      border: 1px solid #ff3355;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(204, 0, 43, 0.3);
    }

    .auth-submit-btn:hover {
      background: linear-gradient(135deg, #ff0033, #a00020);
    }

    .add-ep-box {
      background: #181822;
      border: 1px dashed #444455;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .ep-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #1a1a26;
      border-radius: 8px;
      margin-top: 6px;
      font-size: 0.85rem;
    }

    /* VUE SÉRIE & DÉTAILS DOSSIER */
    .series-header {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      align-items: flex-start;
    }

    .series-poster {
      width: 110px;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .series-details {
      flex: 1;
      text-align: left;
    }

    .season-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid #222233;
    }

    .season-tab-btn {
      padding: 8px 16px;
      background-color: #1a1a24;
      border: 1px solid #333344;
      border-radius: 20px;
      color: #ccc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .season-tab-btn.active {
      background-color: #ff0033;
      border-color: #ff0033;
      color: #fff;
    }

    .episodes-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .episode-card {
      background: #181824;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .episode-title {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .play-ep-btn {
      background-color: #ff0033;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .auth-msg {
      font-size: 0.85rem;
      min-height: 18px;
    }
    .auth-msg.error { color: #ff3355; }
    .auth-msg.success { color: #00ff88; }

    /* ============================
       RESPONSIVE MOBILE
       ============================ */
    @media (max-width: 600px) {
      .header-search {
        padding: 10px 10px;
        gap: 7px;
      }

      .search-input {
        min-width: 0;
        padding: 9px 38px 9px 13px;
        font-size: 0.88rem;
      }

      .lang-btn {
        padding: 8px 10px;
        font-size: 0.78rem;
      }

      .content-area {
        padding: 14px 10px calc(20px + env(safe-area-inset-bottom));
      }

      .media-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }

      .media-card {
        border-radius: 11px;
      }

      .media-cover {
        height: min(52vw, 250px);
        min-height: 150px;
      }

      .media-info {
        padding: 9px 10px;
        gap: 4px;
      }

      .media-title {
        font-size: 0.88rem;
      }

      .media-sub {
        font-size: 0.72rem;
      }

      .media-badge {
        top: 7px;
        left: 7px;
        padding: 3px 7px;
        font-size: 0.65rem;
      }

      .bottom-nav {
        min-height: 62px;
        padding-left: 4px;
        padding-right: 4px;
      }

      .nav-btn {
        min-width: 0;
        padding: 3px 2px;
        font-size: 0.70rem;
      }

      .nav-btn svg {
        width: 20px;
        height: 20px;
      }

      .modal-overlay {
        align-items: flex-start;
        overflow-y: auto;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }

      .modal-card {
        width: 100%;
        max-width: 550px;
        margin: 0 auto;
        padding: 20px 15px;
        border-radius: 16px;
        max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      .modal-close {
        top: 10px;
        right: 12px;
        padding: 6px;
      }

      .publish-type-table {
        border-spacing: 6px;
      }

      .type-box {
        padding: 15px 8px;
      }

      .series-header {
        gap: 10px;
      }

      .series-poster {
        width: 90px;
        height: 130px;
      }

      .episode-card {
        align-items: stretch;
        flex-direction: column;
      }

      .play-ep-btn {
        width: 100%;
        padding: 9px 12px;
      }

      #view-title {
        align-self: flex-start;
        font-size: 1.1rem !important;
        margin-bottom: 6px !important;
      }

      .logo-container {
        max-width: 100%;
        margin-bottom: 28px;
      }

      .logo-text {
        font-size: clamp(2.2rem, 12vw, 3.8rem);
      }

      .bankai-x {
        width: clamp(40px, 14vw, 55px);
        height: clamp(40px, 14vw, 55px);
      }

      .enter-btn {
        max-width: 90vw;
        padding: 12px 24px;
        font-size: 1rem;
      }
    }

    @media (max-width: 380px) {
      .media-grid {
        grid-template-columns: 1fr;
      }

      .media-cover {
        height: 62vw;
      }

      .nav-btn {
        font-size: 0.64rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. ÉCRAN D'ACCUEIL -->
  <div id="splash-screen">
    <div class="logo-container">
      <span class="logo-text">Palm</span>
      <svg class="bankai-x" viewBox="0 0 100 100">
        <g transform="rotate(45 50 50)">
          <path d="M 40,10 H 60 V 40 H 90 V 60 H 60 V 90 H 40 V 60 H 10 V 40 H 40 Z" fill="#000000" stroke="#ff0033" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 60,10 H 90 V 30 H 60 Z" fill="#000000" stroke="#ff0033" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 90,60 V 90 H 70 V 60 Z" fill="#000000" stroke="#ff0033" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 40,90 H 10 V 70 H 40 Z" fill="#000000" stroke="#ff0033" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 10,40 V 10 H 30 V 40 Z" fill="#000000" stroke="#ff0033" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </svg>
      <span class="logo-text">Video</span>
    </div>

    <button class="enter-btn" onclick="enterSite()">Entrer sur le site</button>
  </div>

  <!-- 2. APPLICATION PRINCIPALE -->
  <div id="main-app">
    
    <header class="header-search">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Rechercher des films, séries...">
        <button class="search-btn">🔍</button>
      </div>

      <div class="lang-container">
        <button class="lang-btn" onclick="toggleLangMenu()">
          🌐 <span id="current-lang-code">FR</span>
        </button>
        <div class="lang-dropdown" id="lang-dropdown">
          <div class="lang-option" onclick="selectLanguage('fr')">🇫🇷 Français</div>
          <div class="lang-option" onclick="selectLanguage('en')">🇬🇧 English</div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <h2 id="view-title" style="font-size: 1.3rem; margin-bottom: 15px; color: #fff;">Catalogue (Menu)</h2>
      <div class="media-grid" id="media-container">
        <!-- Les Séries et Films s'affichent ici -->
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-btn active" id="nav-btn-menu" onclick="switchView('menu')">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        <span>Menu</span>
      </button>

      <button class="nav-btn" id="nav-btn-download" onclick="switchView('downloads')">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Téléchargement</span>
      </button>

      <div class="account-container">
        <button class="nav-btn" onclick="toggleAccountMenu(event)">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <span>Compte</span>
        </button>

        <div class="account-dropdown" id="account-dropdown">
          <div id="account-user-info" class="account-info-header" style="display: none;"></div>
          
          <div class="account-option premium-opt" onclick="alert('Option Premium sélectionnée !')">
            <span>⭐</span> <span>Premium</span>
          </div>

          <div class="account-option creator-opt" id="account-publish-btn" style="display: none;" onclick="openPublishModal()">
            <span>🎬</span> <span>Publier un contenu</span>
          </div>

          <div class="account-option" id="account-action-btn" onclick="handleAccountAction()">
            <span>🔑</span> <span id="account-action-text">Se connecter</span>
          </div>
        </div>
      </div>
    </nav>

  </div>

  <!-- 3. FENÊTRE SELECTION PUBLICATION (TABLEAU SERIE / FILM) -->
  <div class="modal-overlay" id="publish-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closePublishModal()">✕</button>

      <!-- ÉTAPE 1: TABLEAU DE CHOIX -->
      <div id="publish-step-choice">
        <h3 style="text-align: center; color: #ff0033; margin-bottom: 10px;">Que souhaitez-vous publier ?</h3>
        <table class="publish-type-table">
          <tr>
            <td>
              <div class="type-box" onclick="selectPublishType('series')">
                <div class="type-box-icon">📺</div>
                <div class="type-box-title">Série</div>
              </div>
            </td>
            <td>
              <div class="type-box" onclick="selectPublishType('film')">
                <div class="type-box-icon">🎬</div>
                <div class="type-box-title">Film</div>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <!-- ÉTAPE 2A: FORMULAIRE FILM -->
      <div id="publish-step-film" style="display: none;">
        <button onclick="backToPublishChoice()" style="background:none; border:none; color:#888; cursor:pointer; margin-bottom:10px;">← Retour</button>
        <h3 style="color: #0088ff; margin-bottom: 15px;">Publier un Film</h3>

        <form class="auth-form" onsubmit="handlePublishFilm(event)">
          <div class="form-group">
            <label>Titre du film</label>
            <input type="text" id="film-title" class="form-input" required>
          </div>

          <div class="form-group">
            <label>Description du film</label>
            <textarea id="film-desc" class="form-textarea" placeholder="Courte description..."></textarea>
          </div>

          <div class="form-group">
            <label>Affiche / Couverture du film (Fichier ou URL)</label>
            <input type="file" id="film-cover-file" class="form-input" accept="image/*">
            <input type="url" id="film-cover-url" class="form-input" placeholder="OU URL de l'image" style="margin-top:5px;">
          </div>

          <div class="form-group">
            <label>Fichier vidéo du film</label>
            <input type="file" id="film-video-file" class="form-input" accept="video/*">
            <input type="url" id="film-video-url" class="form-input" placeholder="OU URL de la vidéo (.mp4)" style="margin-top:5px;">
          </div>

          <p id="film-msg" class="auth-msg"></p>
          <button type="submit" class="auth-submit-btn">Publier le Film</button>
        </form>
      </div>

      <!-- ÉTAPE 2B: FORMULAIRE SÉRIE -->
      <div id="publish-step-series" style="display: none;">
        <button onclick="backToPublishChoice()" style="background:none; border:none; color:#888; cursor:pointer; margin-bottom:10px;">← Retour</button>
        <h3 style="color: #ff0033; margin-bottom: 15px;">Publier une Série</h3>

        <form class="auth-form" onsubmit="handlePublishSeries(event)">
          <div class="form-group">
            <label>Titre de la série</label>
            <input type="text" id="series-title" class="form-input" required>
          </div>

          <div class="form-group">
            <label>Description de la série</label>
            <textarea id="series-desc" class="form-textarea" placeholder="Courte description..."></textarea>
          </div>

          <div class="form-group">
            <label>Image de la série (Affiche / Couverture)</label>
            <input type="file" id="series-cover-file" class="form-input" accept="image/*">
            <input type="url" id="series-cover-url" class="form-input" placeholder="OU URL de l'image" style="margin-top:5px;">
          </div>

          <div class="form-group">
            <label>Nombre de Saisons</label>
            <input type="number" id="series-seasons-count" class="form-input" min="1" max="20" value="1" onchange="updateSeasonBuilder()" onkeyup="updateSeasonBuilder()">
          </div>

          <!-- GESTIONNAIRE D'ÉPISODES PAR SAISON -->
          <div class="add-ep-box">
            <label style="font-size:0.85rem; color:#ffcc00; font-weight:600;">Ajouter des épisodes aux saisons :</label>
            
            <div class="form-group" style="margin-top: 8px;">
              <label>Choisir la Saison</label>
              <select id="series-season-select" class="form-select"></select>
            </div>

            <div class="form-group" style="margin-top: 8px;">
              <label>Titre de l'épisode</label>
              <input type="text" id="ep-title" class="form-input" placeholder="Ex: Épisode 1 - Le commencement">
            </div>

            <div class="form-group" style="margin-top: 8px;">
              <label>Vidéo de l'épisode</label>
              <input type="file" id="ep-file" class="form-input" accept="video/*">
              <input type="url" id="ep-url" class="form-input" placeholder="OU URL vidéo" style="margin-top:4px;">
            </div>

            <button type="button" onclick="addEpisodeToTempSeries()" class="auth-submit-btn" style="background:#222233; border-color:#444; margin-top:10px;">+ Ajouter cet épisode</button>

            <div id="added-episodes-preview" style="margin-top:10px;"></div>
          </div>

          <p id="series-msg" class="auth-msg"></p>
          <button type="submit" class="auth-submit-btn">Publier la Série</button>
        </form>
      </div>

    </div>
  </div>

  <!-- 4. MODALE CONSULTATION DE SÉRIE (DOSSIER) -->
  <div class="modal-overlay" id="series-viewer-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeSeriesViewer()">✕</button>

      <div class="series-header">
        <img id="view-series-cover" class="series-poster" src="" alt="Série">
        <div class="series-details">
          <h2 id="view-series-title" style="color:#fff; font-size:1.3rem;"></h2>
          <p id="view-series-desc" style="color:#aaa; font-size:0.85rem; margin-top:8px;"></p>
          <button id="add-more-ep-btn" style="display:none; margin-top:10px; background:#00ff88; color:#000; font-weight:bold; border:none; padding:6px 12px; border-radius:15px; cursor:pointer;" onclick="openAddMoreEpisodesModal()">+ Rajouter des épisodes</button>
        </div>
      </div>

      <!-- LECTEUR DU SÉLECTIONNÉ -->
      <div id="active-player-container" style="display:none; margin-bottom:15px;">
        <video id="series-active-player" class="video-player" controls style="width:100%; height:200px; background:#000; border-radius:10px;"></video>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
          <span id="series-active-ep-title" style="font-weight:bold; font-size:0.9rem;"></span>
          <button id="series-active-download-btn" class="download-btn" style="margin:0;">Télécharger l'épisode</button>
        </div>
      </div>

      <!-- SAISONS EN ONGLETS / DOSSIERS -->
      <div class="season-tabs" id="view-series-seasons-tabs"></div>

      <!-- LISTE DES ÉPISODES DE LA SAISON SELECTIONNÉE -->
      <div class="episodes-grid" id="view-series-episodes-list"></div>
    </div>
  </div>

  <!-- 5. MODALE AJOUT DE SÉRIES/ÉPISODES EXISTANTE -->
  <div class="modal-overlay" id="add-ep-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAddEpModal()">✕</button>
      <h3 style="color:#00ff88; margin-bottom:15px;">Rajouter des épisodes à la série</h3>

      <div class="form-group">
        <label>Sélectionner la saison</label>
        <select id="add-more-season-select" class="form-select"></select>
      </div>

      <div class="form-group" style="margin-top:10px;">
        <label>Titre du nouvel épisode</label>
        <input type="text" id="add-more-ep-title" class="form-input" placeholder="Titre de l'épisode">
      </div>

      <div class="form-group" style="margin-top:10px;">
        <label>Vidéo de l'épisode</label>
        <input type="file" id="add-more-ep-file" class="form-input" accept="video/*">
        <input type="url" id="add-more-ep-url" class="form-input" placeholder="OU URL vidéo" style="margin-top:4px;">
      </div>

      <p id="add-more-msg" class="auth-msg"></p>
      <button type="button" onclick="saveNewEpisodeToSeries()" class="auth-submit-btn">Enregistrer l'épisode</button>
    </div>
  </div>

  <!-- 6. MODALE CONSULTATION DE FILM -->
  <div class="modal-overlay" id="film-viewer-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeFilmViewer()">✕</button>

      <h2 id="view-film-title" style="color:#fff; margin-bottom:10px;"></h2>
      <video id="film-active-player" controls style="width:100%; height:220px; background:#000; border-radius:10px;"></video>
      <p id="view-film-desc" style="color:#aaa; font-size:0.9rem; margin-top:12px; text-align:left;"></p>
      
      <button id="film-download-btn" class="download-btn" style="width:100%; margin-top:15px;">Télécharger le film</button>
    </div>
  </div>

  <!-- 7. FENÊTRE CONNEXION / INSCRIPTION -->
  <div class="modal-overlay" id="auth-modal" onclick="closeAuthModalOnOutsideClick(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAuthModal()">✕</button>

      <div class="auth-tabs" style="display:flex; background:#1a1a24; border-radius:20px; padding:4px; margin-bottom:20px;">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')" style="flex:1; padding:8px; border:none; background:none; color:#fff; border-radius:16px; cursor:pointer;">Se connecter</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthMode('register')" style="flex:1; padding:8px; border:none; background:none; color:#888; border-radius:16px; cursor:pointer;">Créer un compte</button>
      </div>

      <form class="auth-form" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label>Adresse E-mail</label>
          <input type="email" id="auth-email" class="form-input" required>
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="auth-password" class="form-input" required>
        </div>

        <p id="auth-msg" class="auth-msg"></p>
        <button type="submit" id="auth-submit-btn" class="auth-submit-btn">Se connecter</button>
      </form>
    </div>
  </div>

  <script>
    let currentAuthMode = 'login';
    let currentView = 'menu';

    const ADMIN_EMAIL = "eliakimpalmeradzeu@gmail.com";
    const ADMIN_PASS = "Adzeu 2011";

    // Stockage temporaire lors de la création d'une série
    let tempSeriesSeasons = [];
    let currentOpenedSeriesId = null;

    document.addEventListener("DOMContentLoaded", () => {
      initAdminAccount();
      checkLoggedInUser();
      renderMediaGrid();
    });

    function initAdminAccount() {
      let users = JSON.parse(localStorage.getItem('palmx_users') || '[]');
      const adminExists = users.some(u => u.email === ADMIN_EMAIL.toLowerCase());

      if (!adminExists) {
        users.push({ email: ADMIN_EMAIL.toLowerCase(), password: ADMIN_PASS });
        localStorage.setItem('palmx_users', JSON.stringify(users));
      }
    }

    function enterSite() {
      document.getElementById('splash-screen').classList.add('fade-out');
      document.getElementById('main-app').classList.add('visible');
    }

    function switchView(viewName) {
      currentView = viewName;
      const menuBtn = document.getElementById('nav-btn-menu');
      const downloadBtn = document.getElementById('nav-btn-download');
      const viewTitle = document.getElementById('view-title');

      if (viewName === 'menu') {
        menuBtn.classList.add('active');
        downloadBtn.classList.remove('active');
        viewTitle.innerText = "Catalogue (Menu)";
      } else {
        downloadBtn.classList.add('active');
        menuBtn.classList.remove('active');
        viewTitle.innerText = "Mes Téléchargements";
      }

      renderMediaGrid();
    }

    /* GESTION AUTHENTIFICATION */
    function switchAuthMode(mode) {
      currentAuthMode = mode;
      document.getElementById('tab-login').style.color = mode === 'login' ? '#fff' : '#888';
      document.getElementById('tab-register').style.color = mode === 'register' ? '#fff' : '#888';
      document.getElementById('auth-submit-btn').innerText = mode === 'login' ? "Se connecter" : "Créer mon compte";
    }

    function openAuthModal() {
      document.getElementById('account-dropdown').classList.remove('show');
      document.getElementById('auth-modal').classList.add('show');
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.remove('show');
    }

    function closeAuthModalOnOutsideClick(event) {
      if (event.target.id === 'auth-modal') closeAuthModal();
    }

    function handleAuthSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-password').value;
      const msgEl = document.getElementById('auth-msg');

      let users = JSON.parse(localStorage.getItem('palmx_users') || '[]');

      if (currentAuthMode === 'register') {
        if (users.some(u => u.email === email)) {
          msgEl.className = 'auth-msg error';
          msgEl.innerText = "Ce compte existe déjà.";
          return;
        }
        users.push({ email, password });
        localStorage.setItem('palmx_users', JSON.stringify(users));
        msgEl.className = 'auth-msg success';
        msgEl.innerText = "Compte créé ! Connexion...";
        setTimeout(() => loginUser(email), 800);
      } else {
        if (users.some(u => u.email === email && u.password === password)) {
          loginUser(email);
        } else {
          msgEl.className = 'auth-msg error';
          msgEl.innerText = "Email ou mot de passe incorrect.";
        }
      }
    }

    function loginUser(email) {
      localStorage.setItem('palmx_logged_in_user', email);
      checkLoggedInUser();
      closeAuthModal();
      renderMediaGrid();
    }

    function logoutUser() {
      localStorage.removeItem('palmx_logged_in_user');
      checkLoggedInUser();
      document.getElementById('account-dropdown').classList.remove('show');
      renderMediaGrid();
    }

    function checkLoggedInUser() {
      const loggedUser = localStorage.getItem('palmx_logged_in_user');
      const actionText = document.getElementById('account-action-text');
      const userInfoHeader = document.getElementById('account-user-info');
      const publishBtn = document.getElementById('account-publish-btn');

      if (loggedUser) {
        actionText.innerText = "Se déconnecter";
        userInfoHeader.innerText = loggedUser;
        userInfoHeader.style.display = 'block';
        publishBtn.style.display = (loggedUser === ADMIN_EMAIL.toLowerCase()) ? 'flex' : 'none';
      } else {
        actionText.innerText = "Se connecter";
        userInfoHeader.style.display = 'none';
        publishBtn.style.display = 'none';
      }
    }

    function handleAccountAction() {
      if (localStorage.getItem('palmx_logged_in_user')) logoutUser();
      else openAuthModal();
    }

    /* GESTION DU BOUTON PUBLIER (MODALE AVEC OPTIONS SÉRIE / FILM) */
    function openPublishModal() {
      document.getElementById('account-dropdown').classList.remove('show');
      document.getElementById('publish-modal').classList.add('show');
      backToPublishChoice();
    }

    function closePublishModal() {
      document.getElementById('publish-modal').classList.remove('show');
    }

    function backToPublishChoice() {
      document.getElementById('publish-step-choice').style.display = 'block';
      document.getElementById('publish-step-film').style.display = 'none';
      document.getElementById('publish-step-series').style.display = 'none';
    }

    function selectPublishType(type) {
      document.getElementById('publish-step-choice').style.display = 'none';
      if (type === 'film') {
        document.getElementById('publish-step-film').style.display = 'block';
      } else if (type === 'series') {
        document.getElementById('publish-step-series').style.display = 'block';
        updateSeasonBuilder();
      }
    }

    /* PUBLICATION FILM */
    function handlePublishFilm(event) {
      event.preventDefault();
      const title = document.getElementById('film-title').value.trim();
      const desc = document.getElementById('film-desc').value.trim();
      const coverFile = document.getElementById('film-cover-file').files[0];
      const coverUrl = document.getElementById('film-cover-url').value.trim();
      const videoFile = document.getElementById('film-video-file').files[0];
      const videoUrl = document.getElementById('film-video-url').value.trim();
      const msgEl = document.getElementById('film-msg');

      let coverSrc = coverFile ? URL.createObjectURL(coverFile) : (coverUrl || 'https://via.placeholder.com/300x400/222/fff?text=Film');
      let videoSrc = videoFile ? URL.createObjectURL(videoFile) : videoUrl;

      if (!videoSrc) {
        msgEl.className = 'auth-msg error';
        msgEl.innerText = "Veuillez spécifier une vidéo pour le film.";
        return;
      }

      const newMedia = {
        id: Date.now(),
        type: 'film',
        title: title,
        desc: desc,
        cover: coverSrc,
        src: videoSrc,
        author: localStorage.getItem('palmx_logged_in_user') || 'Admin',
        date: new Date().toLocaleDateString('fr-FR')
      };

      let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');
      catalog.unshift(newMedia);
      localStorage.setItem('palmx_catalog', JSON.stringify(catalog));

      msgEl.className = 'auth-msg success';
      msgEl.innerText = "Film publié avec succès !";
      setTimeout(() => {
        closePublishModal();
        switchView('menu');
      }, 1000);
    }

    /* PUBLICATION SÉRIE & SAISONS */
    function updateSeasonBuilder() {
      const count = parseInt(document.getElementById('series-seasons-count').value) || 1;
      const select = document.getElementById('series-season-select');
      select.innerHTML = '';

      // Ajuster le tableau tempSeriesSeasons
      while (tempSeriesSeasons.length < count) {
        tempSeriesSeasons.push({ seasonNum: tempSeriesSeasons.length + 1, episodes: [] });
      }
      if (tempSeriesSeasons.length > count) {
        tempSeriesSeasons = tempSeriesSeasons.slice(0, count);
      }

      for (let i = 1; i <= count; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Saison ${i}`;
        select.appendChild(opt);
      }

      renderTempEpisodesPreview();
    }

    function addEpisodeToTempSeries() {
      const seasonNum = parseInt(document.getElementById('series-season-select').value);
      const title = document.getElementById('ep-title').value.trim();
      const file = document.getElementById('ep-file').files[0];
      const url = document.getElementById('ep-url').value.trim();

      let videoSrc = file ? URL.createObjectURL(file) : url;

      if (!title || !videoSrc) {
        alert("Veuillez renseigner le titre et la vidéo de l'épisode.");
        return;
      }

      const targetSeason = tempSeriesSeasons.find(s => s.seasonNum === seasonNum);
      if (targetSeason) {
        targetSeason.episodes.push({
          id: Date.now(),
          title: title,
          src: videoSrc
        });
      }

      document.getElementById('ep-title').value = '';
      document.getElementById('ep-file').value = '';
      document.getElementById('ep-url').value = '';

      renderTempEpisodesPreview();
    }

    function renderTempEpisodesPreview() {
      const container = document.getElementById('added-episodes-preview');
      container.innerHTML = '';

      tempSeriesSeasons.forEach(s => {
        if (s.episodes.length > 0) {
          const sTitle = document.createElement('div');
          sTitle.style.cssText = "font-size:0.8rem; color:#ff0033; font-weight:bold; margin-top:8px;";
          sTitle.innerText = `--- Saison ${s.seasonNum} (${s.episodes.length} épisodes) ---`;
          container.appendChild(sTitle);

          s.episodes.forEach((ep, idx) => {
            const epEl = document.createElement('div');
            epEl.className = 'ep-list-item';
            epEl.innerHTML = `<span>${ep.title}</span><button type="button" onclick="removeTempEp(${s.seasonNum}, ${idx})" style="background:none; border:none; color:#ff3355; cursor:pointer;">✕</button>`;
            container.appendChild(epEl);
          });
        }
      });
    }

    function removeTempEp(seasonNum, epIndex) {
      const targetSeason = tempSeriesSeasons.find(s => s.seasonNum === seasonNum);
      if (targetSeason) {
        targetSeason.episodes.splice(epIndex, 1);
        renderTempEpisodesPreview();
      }
    }

    function handlePublishSeries(event) {
      event.preventDefault();
      const title = document.getElementById('series-title').value.trim();
      const desc = document.getElementById('series-desc').value.trim();
      const coverFile = document.getElementById('series-cover-file').files[0];
      const coverUrl = document.getElementById('series-cover-url').value.trim();
      const msgEl = document.getElementById('series-msg');

      let coverSrc = coverFile ? URL.createObjectURL(coverFile) : (coverUrl || 'https://via.placeholder.com/300x400/222/fff?text=Serie');

      const newSeries = {
        id: Date.now(),
        type: 'series',
        title: title,
        desc: desc,
        cover: coverSrc,
        seasons: tempSeriesSeasons,
        author: localStorage.getItem('palmx_logged_in_user') || 'Admin',
        date: new Date().toLocaleDateString('fr-FR')
      };

      let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');
      catalog.unshift(newSeries);
      localStorage.setItem('palmx_catalog', JSON.stringify(catalog));

      msgEl.className = 'auth-msg success';
      msgEl.innerText = "Série publiée avec succès !";
      setTimeout(() => {
        tempSeriesSeasons = [];
        closePublishModal();
        switchView('menu');
      }, 1000);
    }

    /* AFFICHAGE DE LA GRILLE PRINCIPALE (FILMS & SÉRIES) */
    function renderMediaGrid() {
      const container = document.getElementById('media-container');

      if (currentView === 'menu') {
        let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');

        if (catalog.length === 0) {
          container.innerHTML = `<p class="no-videos">Aucune série ou film disponible pour le moment.</p>`;
          return;
        }

        container.innerHTML = catalog.map(m => `
          <div class="media-card" onclick="openMediaDetails(${m.id})">
            <span class="media-badge ${m.type === 'series' ? 'badge-series' : 'badge-film'}">${m.type}</span>
            <img class="media-cover" src="${m.cover}" alt="${m.title}">
            <div class="media-info">
              <div class="media-title">${m.title}</div>
              <div class="media-sub">${m.type === 'series' ? m.seasons.length + ' Saison(s)' : 'Film complet'}</div>
            </div>
          </div>
        `).join('');

      } else if (currentView === 'downloads') {
        let downloads = JSON.parse(localStorage.getItem('palmx_downloads') || '[]');

        if (downloads.length === 0) {
          container.innerHTML = `<p class="no-videos">Aucun téléchargement enregistre pour l'instant.</p>`;
          return;
        }

        container.innerHTML = downloads.map(d => `
          <div class="media-card">
            <video controls src="${d.src}" style="width:100%; height:180px; background:#000;"></video>
            <div class="media-info">
              <div class="media-title">${d.title}</div>
              <div class="media-sub">Enregistré dans Téléchargements</div>
            </div>
          </div>
        `).join('');
      }
    }

    /* VUE DETAIL / DOSSIER D'UNE SÉRIE OU FILM */
    function openMediaDetails(mediaId) {
      let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');
      let media = catalog.find(m => m.id === mediaId);

      if (!media) return;

      if (media.type === 'film') {
        document.getElementById('view-film-title').innerText = media.title;
        document.getElementById('view-film-desc').innerText = media.desc || 'Aucune description.';
        const player = document.getElementById('film-active-player');
        player.src = media.src;

        document.getElementById('film-download-btn').onclick = () => saveToDownloads(media.title, media.src);
        document.getElementById('film-viewer-modal').classList.add('show');

      } else if (media.type === 'series') {
        currentOpenedSeriesId = media.id;
        document.getElementById('view-series-title').innerText = media.title;
        document.getElementById('view-series-desc').innerText = media.desc || 'Aucune description.';
        document.getElementById('view-series-cover').src = media.cover;

        // Si l'utilisateur est admin, il peut ajouter des épisodes
        const loggedUser = localStorage.getItem('palmx_logged_in_user');
        const addMoreBtn = document.getElementById('add-more-ep-btn');
        if (loggedUser && loggedUser === ADMIN_EMAIL.toLowerCase()) {
          addMoreBtn.style.display = 'inline-block';
        } else {
          addMoreBtn.style.display = 'none';
        }

        renderSeriesSeasonsAndEpisodes(media, 1);
        document.getElementById('series-viewer-modal').classList.add('show');
      }
    }

    function renderSeriesSeasonsAndEpisodes(series, activeSeasonNum) {
      const tabsContainer = document.getElementById('view-series-seasons-tabs');
      const epListContainer = document.getElementById('view-series-episodes-list');

      tabsContainer.innerHTML = '';
      epListContainer.innerHTML = '';

      if (!series.seasons || series.seasons.length === 0) {
        epListContainer.innerHTML = `<p style="color:#888;">Aucun épisode disponible dans cette série.</p>`;
        return;
      }

      // Onglets / Dossiers Saisons
      series.seasons.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `season-tab-btn ${s.seasonNum === activeSeasonNum ? 'active' : ''}`;
        btn.innerText = `Saison ${s.seasonNum}`;
        btn.onclick = () => renderSeriesSeasonsAndEpisodes(series, s.seasonNum);
        tabsContainer.appendChild(btn);
      });

      // Liste des épisodes de la saison
      const currentSeason = series.seasons.find(s => s.seasonNum === activeSeasonNum);
      if (currentSeason && currentSeason.episodes.length > 0) {
        currentSeason.episodes.forEach(ep => {
          const card = document.createElement('div');
          card.className = 'episode-card';
          card.innerHTML = `
            <span class="episode-title">${ep.title}</span>
            <button class="play-ep-btn" onclick="playSeriesEpisode('${ep.title.replace(/'/g, "\\'")}', '${ep.src}')">▶ Regarder</button>
          `;
          epListContainer.appendChild(card);
        });
      } else {
        epListContainer.innerHTML = `<p style="color:#888; padding:10px;">Aucun épisode dans la Saison ${activeSeasonNum}.</p>`;
      }
    }

    function playSeriesEpisode(title, src) {
      const container = document.getElementById('active-player-container');
      const player = document.getElementById('series-active-player');
      const titleEl = document.getElementById('series-active-ep-title');
      const dlBtn = document.getElementById('series-active-download-btn');

      container.style.display = 'block';
      player.src = src;
      player.play();
      titleEl.innerText = title;
      dlBtn.onclick = () => saveToDownloads(title, src);
    }

    function closeSeriesViewer() {
      document.getElementById('series-viewer-modal').classList.remove('show');
      const player = document.getElementById('series-active-player');
      player.pause();
      document.getElementById('active-player-container').style.display = 'none';
    }

    function closeFilmViewer() {
      document.getElementById('film-viewer-modal').classList.remove('show');
      document.getElementById('film-active-player').pause();
    }

    /* AJOUT DE NOUVEAUX ÉPISODES À UNE SÉRIE EXISTANTE (ADMIN) */
    function openAddMoreEpisodesModal() {
      let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');
      let series = catalog.find(m => m.id === currentOpenedSeriesId);

      if (!series) return;

      const select = document.getElementById('add-more-season-select');
      select.innerHTML = '';

      series.seasons.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.seasonNum;
        opt.innerText = `Saison ${s.seasonNum}`;
        select.appendChild(opt);
      });

      // Possibilité de créer une nouvelle saison
      const newSeasonOpt = document.createElement('option');
      newSeasonOpt.value = series.seasons.length + 1;
      newSeasonOpt.innerText = `+ Créer la Saison ${series.seasons.length + 1}`;
      select.appendChild(newSeasonOpt);

      document.getElementById('add-ep-modal').classList.add('show');
    }

    function closeAddEpModal() {
      document.getElementById('add-ep-modal').classList.remove('show');
      document.getElementById('add-more-ep-title').value = '';
      document.getElementById('add-more-ep-file').value = '';
      document.getElementById('add-more-ep-url').value = '';
      document.getElementById('add-more-msg').innerText = '';
    }

    function saveNewEpisodeToSeries() {
      const seasonNum = parseInt(document.getElementById('add-more-season-select').value);
      const title = document.getElementById('add-more-ep-title').value.trim();
      const file = document.getElementById('add-more-ep-file').files[0];
      const url = document.getElementById('add-more-ep-url').value.trim();
      const msgEl = document.getElementById('add-more-msg');

      let videoSrc = file ? URL.createObjectURL(file) : url;

      if (!title || !videoSrc) {
        msgEl.className = 'auth-msg error';
        msgEl.innerText = "Veuillez remplir le titre et la vidéo.";
        return;
      }

      let catalog = JSON.parse(localStorage.getItem('palmx_catalog') || '[]');
      let seriesIndex = catalog.findIndex(m => m.id === currentOpenedSeriesId);

      if (seriesIndex !== -1) {
        let series = catalog[seriesIndex];
        let targetSeason = series.seasons.find(s => s.seasonNum === seasonNum);

        if (!targetSeason) {
          targetSeason = { seasonNum: seasonNum, episodes: [] };
          series.seasons.push(targetSeason);
        }

        targetSeason.episodes.push({
          id: Date.now(),
          title: title,
          src: videoSrc
        });

        localStorage.setItem('palmx_catalog', JSON.stringify(catalog));

        msgEl.className = 'auth-msg success';
        msgEl.innerText = "Épisode rajouté avec succès !";

        setTimeout(() => {
          closeAddEpModal();
          renderSeriesSeasonsAndEpisodes(series, seasonNum);
        }, 1000);
      }
    }

    /* TELECHARGEMENT DES VIDÉOS */
    function saveToDownloads(title, src) {
      let downloads = JSON.parse(localStorage.getItem('palmx_downloads') || '[]');
      downloads.unshift({ id: Date.now(), title: title, src: src });
      localStorage.setItem('palmx_downloads', JSON.stringify(downloads));

      const a = document.createElement('a');
      a.href = src;
      a.download = `${title.replace(/\s+/g, '_')}.mp4`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      alert(`'${title}' a été ajouté à la section Téléchargements !`);
    }

    /* MENU LANGUE */
    function toggleLangMenu() {
      document.getElementById('account-dropdown').classList.remove('show');
      document.getElementById('lang-dropdown').classList.toggle('show');
    }

    function toggleAccountMenu(event) {
      if (event) event.stopPropagation();
      document.getElementById('lang-dropdown').classList.remove('show');
      document.getElementById('account-dropdown').classList.toggle('show');
    }

    function selectLanguage(lang) {
      document.getElementById('current-lang-code').innerText = lang.toUpperCase();
      document.getElementById('lang-dropdown').classList.remove('show');
    }

    window.onclick = function(event) {
      if (!event.target.closest('.lang-container')) {
        document.getElementById('lang-dropdown').classList.remove('show');
      }
      if (!event.target.closest('.account-container')) {
        document.getElementById('account-dropdown').classList.remove('show');
      }
    };
  </script>
</body>
</html>
